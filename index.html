<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#061316">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Dungeon Survivor</title>
</head>
<body>
  <main id="app">
    <section id="topUI">
      <div class="brand"><span>DUNGEON</span><strong>SURVIVOR</strong></div>
      <div class="stats">
        <div class="stat"><span class="label">PURSE</span><span id="gold" class="value gold">0</span></div>
        <div class="stat healthStat"><span class="label">HEALTH</span><div class="healthLine"><div class="healthTrack"><div id="hp"></div></div><span id="hpText">100 / 100</span></div></div>
        <div class="stat"><span class="label">XP</span><div class="xpLine"><div class="xpTrack"><div id="xp"></div></div><span id="levelText">LV 1</span></div></div>
        <div class="stat roomStat"><span class="label">ROOM</span><span id="room" class="value">1</span><span id="areaText" class="subvalue">AREA 1 • CASTLE</span></div>
      </div>
    </section>

    <section id="gameFrame">
      <canvas id="game"></canvas>
      <div id="splashScreen" aria-label="Dungeon Survivor splash screen"></div>
      <div id="startScreen" aria-label="Dungeon Survivor start menu">
        <button id="playButton" type="button" aria-label="Play">PLAY</button>
      </div>
      <div id="bossWarning" aria-live="polite"></div>
      <div id="message"></div>
      <div id="pickupNotice"></div>
    </section>

    <section id="controls">
      <div id="stick"><div id="nub"></div></div>
      <div id="controlHint">MOVE</div>
      <div id="fire">⚔<span>SWING</span></div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
