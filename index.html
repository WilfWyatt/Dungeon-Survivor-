<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#061316">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Dungeon Survivor</title>
</head>
<body>
  <main id="app">
    <section id="topUI" aria-label="Player status">
      <div class="stats">
        <div class="stat healthStat"><span class="label">HEALTH</span><div class="healthLine"><div class="healthTrack"><div id="hp"></div></div><span id="hpText">100 / 100</span></div></div>
        <div class="stat xpStat"><span class="label">XP / LEVEL</span><div class="xpLine"><span id="levelText">LV 1</span><div class="xpTrack"><div id="xp"></div></div><span id="xpTextTop">12 XP</span></div></div>
        <div class="stat purseStat"><span class="label">PURSE</span><span id="gold" class="value gold">0</span></div>
        <div class="stat roomStat"><span class="label">ROOM</span><span id="room" class="value">1</span><span id="areaText" class="subvalue">CASTLE • R1</span></div>
      </div>
    </section>

    <section id="gameFrame">
      <canvas id="game"></canvas>
      <div id="splashScreen" aria-label="Dungeon Survivor splash screen"></div>
      <div id="startScreen" aria-label="Dungeon Survivor start menu">
        <button id="playButton" type="button" aria-label="Play">PLAY</button>
        <div id="menuActions">
          <button id="scoreboardButton" type="button">LOCAL SCOREBOARD</button>
          <button id="exitAppButton" type="button">EXIT APP</button>
        </div>
        <div id="versionLabel">v0.3.1</div>
      </div>
      <div id="scoreboardScreen" aria-label="Local scoreboard">
        <div class="menuPanel scoreboardPanel">
          <div class="menuTitle">DUNGEON RECORDS</div>
          <div id="scoreList"></div>
          <button id="scoreboardBack" type="button" class="menuButton">BACK TO START</button>
        </div>
      </div>
      <div id="weaponScreen" aria-label="Weapon discovery screen">
        <div class="menuPanel weaponPanel">
          <div id="weaponTitle" class="menuTitle">WEAPON FOUND</div>
          <div id="weaponSub" class="menuSub"></div>
          <div id="weaponCard"></div>
          <div class="weaponButtons">
            <button id="equipWeapon" type="button" class="menuButton primary">EQUIP</button>
            <button id="keepWeapon" type="button" class="menuButton">KEEP CURRENT</button>
          </div>
        </div>
      </div>
      <div id="inventoryScreen" aria-label="Inventory and player card">
        <div class="menuPanel inventoryPanel">
          <div class="inventoryHeader"><div><div class="menuTitle">INVENTORY</div><div class="menuSub">PLAYER CARD • GAME PAUSED</div></div><button id="inventoryClose" type="button" aria-label="Close inventory">×</button></div>
          <div id="inventoryContent"></div>
          <button id="inventoryCloseBottom" type="button" class="menuButton primary">CLOSE INVENTORY</button>
        </div>
      </div>
      <div id="bossWarning" aria-live="polite"></div>
      <div id="message" aria-live="polite"></div>
      <div id="pickupNotice"></div>
    </section>

    <section id="controls" aria-label="Game controls">
      <div id="stick"><div id="nub"></div></div>
      <button id="inventoryButton" type="button" aria-label="Open inventory"><span>✦</span><small>INVENTORY</small></button>
      <div id="controlHint">MOVE</div>
      <div id="fire" role="button" aria-label="Swing sword">⚔<span>SWING</span></div>
    </section>
  </main>
  <script src="game.js?v=0.3.1"></script>
</body>
</html>
