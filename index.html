<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#061316">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Dungeon Survivor</title>
  <style>
    #roomRewardScreen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:50;background:rgba(2,9,10,.9);padding:12px;box-sizing:border-box}
    #roomRewardScreen.show{display:flex}
    .roomRewardPanel{width:min(680px,100%);max-height:100%;overflow:auto;padding:16px;box-sizing:border-box}
    .roomRewardHeader{text-align:center;margin-bottom:12px}
    .roomRewardGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .rewardPanel{min-width:0;padding:11px;background:rgba(6,22,25,.72);border:1px solid rgba(55,101,102,.9);border-radius:5px;box-sizing:border-box}
    .rewardPanel.burning{animation:rewardBurn .24s ease}
    @keyframes rewardBurn{50%{transform:scale(.985);filter:brightness(1.5)}}
    .rewardMiniTitle{color:#83f0d7;font-size:10px;font-weight:700;letter-spacing:.7px;margin-bottom:8px;text-align:center}
    .rewardEmpty{text-align:center;min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:7px;color:#9ab0aa}
    .rewardEmpty b{color:#d8d4bd;font-size:11px}
    .rewardEmpty small{font-size:9px;line-height:1.35}
    .rewardLevelList{display:flex;flex-direction:column;gap:7px}
    .levelChoice{appearance:none;border:1px solid rgba(131,240,215,.45);background:rgba(23,45,49,.92);color:#d8d4bd;border-radius:5px;padding:10px;text-align:left;font:inherit;min-height:54px;touch-action:manipulation}
    .levelChoice:active,.menuButton:active{transform:scale(.985)}
    .levelChoice b{display:block;color:#83f0d7;font-size:11px;letter-spacing:.4px}
    .levelChoice small{display:block;margin-top:4px;color:#9ab0aa;font-size:8.5px;line-height:1.35}
    .rewardWeaponWrap .weaponCompare{font-size:9px}
    .roomRewardActions{margin-top:10px}
    #roomRewardContinue{width:100%}
    #roomRewardContinue:disabled{opacity:.42;filter:grayscale(.35)}
    @media (max-width:560px){
      .roomRewardPanel{padding:13px}
      .roomRewardGrid{grid-template-columns:1fr}
      .rewardPanel{padding:10px}
      .rewardEmpty{min-height:80px}
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="topUI" aria-label="Player status">
      <div class="stats">
        <div class="stat healthStat"><span class="label">HEALTH</span><div class="healthLine"><div class="healthTrack"><div id="hp"></div></div><span id="hpText">100 / 100</span></div></div>
        <div class="stat xpStat"><span class="label">XP / LEVEL</span><div class="xpLine"><span id="levelText">LV 1</span><div class="xpTrack"><div id="xp"></div></div><span id="xpTextTop">12 XP</span></div></div>
        <div class="stat purseStat"><span class="label">PURSE</span><span id="gold" class="value gold">0</span></div>
        <div class="stat roomStat"><span class="label">ROOM</span><span id="room" class="value">1</span><span id="areaText" class="subvalue">CASTLE • R1</span></div>
      </div>
    </section>

    <section id="gameFrame">
      <canvas id="game"></canvas>
      <div id="splashScreen" aria-label="Dungeon Survivor splash screen"></div>
      <div id="startScreen" aria-label="Dungeon Survivor start menu">
        <button id="playButton" type="button" aria-label="Play">PLAY</button>
        <div id="menuActions">
          <button id="scoreboardButton" type="button">LOCAL SCOREBOARD</button>
          <button id="exitAppButton" type="button">EXIT APP</button>
        </div>
        <div id="versionLabel">v0.3.8b</div>
      </div>
      <div id="roomRewardScreen" aria-label="Room reward screen">
        <div class="menuPanel roomRewardPanel">
          <div class="roomRewardHeader">
            <div id="roomRewardTitle" class="menuTitle">ROOM REWARD</div>
            <div id="roomRewardSub" class="menuSub">CHOOSE YOUR REWARDS</div>
          </div>
          <div class="roomRewardGrid">
            <div id="rewardWeaponPanel" class="rewardPanel"></div>
            <div id="rewardLevelPanel" class="rewardPanel"></div>
          </div>
          <div class="roomRewardActions"><button id="roomRewardContinue" type="button" class="menuButton primary" disabled>MAKE ALL CHOICES</button></div>
        </div>
      </div>
      <div id="scoreboardScreen" aria-label="Local scoreboard">
        <div class="menuPanel scoreboardPanel">
          <div class="menuTitle">DUNGEON RECORDS</div>
          <div id="scoreList"></div>
          <div class="scoreboardActions"><button id="clearScoreboard" type="button" class="menuButton">CLEAR SCOREBOARD</button><button id="scoreboardBack" type="button" class="menuButton">BACK TO START</button></div>
        </div>
      </div>
      <div id="inventoryScreen" aria-label="Inventory and player card">
        <div class="menuPanel inventoryPanel">
          <div class="inventoryHeader"><div><div class="menuTitle">INVENTORY</div><div class="menuSub">PLAYER CARD • GAME PAUSED</div></div><button id="inventoryClose" type="button" aria-label="Close inventory">×</button></div>
          <div id="inventoryContent"></div>
          <button id="inventoryCloseBottom" type="button" class="menuButton primary">CLOSE INVENTORY</button>
        </div>
      </div>
      <div id="bossWarning" aria-live="polite"></div>
      <div id="message" aria-live="polite"></div>
      <div id="pickupNotice"></div>
    </section>

    <section id="controls" aria-label="Game controls">
      <div id="stick"><div id="nub"></div></div>
      <button id="inventoryButton" type="button" aria-label="Open inventory"><span>✦</span><small>INVENTORY</small></button>
      <div id="controlHint">MOVE</div>
      <div id="fire" role="button" aria-label="Swing sword">⚔<span>SWING</span></div>
    </section>
  </main>
  <script src="game.js?v=0.3.8b"></script>
</body>
</html>
